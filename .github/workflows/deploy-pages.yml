name: Build and deploy Project Vortex portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Test replay position model
        run: npm run test:replay
      - name: Audit sanitized replay data
        run: python3 scripts/test_trade_replay.py
      - name: Build static site
        run: npm run build
      - name: Audit public files
        run: python3 scripts/audit_public_site.py
      - name: Run static-site regression checks
        run: python3 scripts/test_static_site.py
      - name: Upload dist artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
